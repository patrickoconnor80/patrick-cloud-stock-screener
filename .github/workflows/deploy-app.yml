name: Deploy Stock Screener App

on:
  push:
    branches: [main]
    paths:
      - "screener.py"
      - "lambda_handler.py"
      - "requirements.txt"
      - "Dockerfile"

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_NAME: patrick-cloud-dev-stock-screener
  ECR_REPOSITORY: patrick-cloud-dev-stock-screener

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948065143262:role/patrick-cloud-dev-terraform-deployer-role
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE_URI"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "${{ steps.build.outputs.image_uri }}"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Invoke once so the site refreshes immediately
        run: |
          aws lambda invoke --function-name "$FUNCTION_NAME" /tmp/invoke-output.json
          cat /tmp/invoke-output.json
