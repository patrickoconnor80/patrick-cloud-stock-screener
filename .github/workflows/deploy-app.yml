name: Deploy Stock Screener App

on:
  push:
    branches: [main]
    paths:
      - "screener.py"
      - "lambda_handler.py"
      - "requirements.txt"
      - "Dockerfile"
      - "gex.py"
      - "gex_handler.py"
      - "events.json"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_NAME: patrick-cloud-dev-stock-screener
  GEX_FUNCTION_NAME: patrick-cloud-dev-gex
  ECR_REPOSITORY: patrick-cloud-dev-stock-screener

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948065143262:role/patrick-cloud-dev-terraform-deployer-role
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # Lambda rejects OCI image indexes with attestations, which newer
          # buildx emits by default; force a single-platform Docker v2 manifest.
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --output type=registry,oci-mediatypes=false \
            -t "$IMAGE_URI" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "${{ steps.build.outputs.image_uri }}"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Update GEX Lambda code and refresh gex.json
        run: |
          # Same image, different entrypoint (image_config in tf/gex.tf). Skip if
          # Terraform hasn't created the function yet.
          if aws lambda get-function --function-name "$GEX_FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$GEX_FUNCTION_NAME" \
              --image-uri "${{ steps.build.outputs.image_uri }}"
            aws lambda wait function-updated --function-name "$GEX_FUNCTION_NAME"
            aws lambda invoke --cli-read-timeout 300 --function-name "$GEX_FUNCTION_NAME" \
              --cli-binary-format raw-in-base64-out --payload '{"force": true}' /tmp/gex-output.json
            cat /tmp/gex-output.json
          else
            echo "GEX function not created yet; run Terraform first."
          fi

      - name: Invoke once so the site refreshes immediately
        run: |
          # Full screen run can take several minutes; the default CLI read timeout is too short.
          aws lambda invoke --cli-read-timeout 900 --function-name "$FUNCTION_NAME" /tmp/invoke-output.json
          cat /tmp/invoke-output.json
