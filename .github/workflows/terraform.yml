name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "tf/**"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948065143262:role/patrick-cloud-dev-terraform-deployer-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform init
        run: terraform init -backend-config=./env/dev/backend.config -reconfigure

      - name: Terraform apply
        run: terraform apply -var-file=./env/dev/dev.tfvars -lock=false -auto-approve
